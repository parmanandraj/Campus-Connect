<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container auth-page">
    <header class="site-header auth-header">
      <div class="logo-block small-logo">
        <img src="./images/logo.webp" alt="CampusConnect Logo">
        <div>
          <h1 class="site-title">CampusConnect</h1>
          <p class="site-tagline">Student and admin campus portal.</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </nav>
    </header>
    <div class="auth-card">
      <h1>Register</h1>
      <p class="subtitle">Create a student or admin account to start using CampusConnect.</p>
      <form id="registerForm">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" />

        <label for="role">Role</label>
        <select id="role" name="role">
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Register</button>
      </form>
      <p class="small-text">Already have an account? <a href="login.html">Login here</a>.</p>
      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
