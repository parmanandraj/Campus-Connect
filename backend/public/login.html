<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container auth-page">
    <header class="site-header auth-header">
      <div class="logo-block small-logo">
        <img src="./images/logo.webp" alt="CampusConnect Logo">
        <div>
          <h1 class="site-title">CampusConnect</h1>
          <p class="site-tagline">Student and admin campus portal.</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
      </nav>
    </header>
    <div class="auth-card">
      <h1>Login</h1>
      <p class="subtitle">Access your CampusConnect account.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Login</button>
      </form>
      <p class="small-text">Need an account? <a href="register.html">Register here</a>.</p>
      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
