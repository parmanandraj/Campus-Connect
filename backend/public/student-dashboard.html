<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div class="logo-block small-logo">
        <img src="./images/logo.webp" alt="CampusConnect Logo">
        <div>
          <h1>Student Dashboard</h1>
          <p class="subtitle">Welcome, <span id="studentName"></span></p>
        </div>
      </div>
      <nav class="nav-links dashboard-nav">
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
      </nav>
      <button id="logoutBtn" class="button secondary">Logout</button>
    </header>
    <div id="message" class="message"></div>

    <section class="dashboard-section stats-row">
      <div class="stat-card">
        <h3>Assignments</h3>
        <p id="assignmentCount">0</p>
      </div>
      <div class="stat-card">
        <h3>Job Posts</h3>
        <p id="jobCount">0</p>
      </div>
    </section>

    <section class="dashboard-section cards-row">
      <div class="card">
        <h3>Assignments</h3>
        <ul id="assignmentList"></ul>
      </div>
      <div class="card">
        <h3>Job Opportunities</h3>
        <ul id="jobList"></ul>
      </div>
    </section>

    <section class="dashboard-section">
      <a class="button" href="profile.html">View Profile</a>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
