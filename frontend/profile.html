<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | CampusConnect</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <header class="page-header">
      <div>
        <h1>My Profile</h1>
        <p class="subtitle">Update your account details and view your role information.</p>
      </div>
      <button id="logoutBtn" class="button secondary">Logout</button>
    </header>
    <div id="message" class="message"></div>

    <section class="dashboard-section cards-row">
      <div class="card profile-card">
        <p><strong>Name:</strong> <span id="profileName"></span></p>
        <p><strong>Email:</strong> <span id="profileEmail"></span></p>
        <p><strong>Role:</strong> <span id="profileRole"></span></p>
        <p><strong>Member Since:</strong> <span id="profileCreated"></span></p>
      </div>
      <div class="card">
        <h3>Update Profile</h3>
        <form id="profileForm" class="small-form">
          <label for="profileNameInput">Name</label>
          <input type="text" id="profileNameInput" />

          <label for="profilePassword">New Password</label>
          <input type="password" id="profilePassword" placeholder="Leave blank to keep current password" />

          <label for="profilePasswordConfirm">Confirm Password</label>
          <input type="password" id="profilePasswordConfirm" placeholder="Match new password" />

          <button type="submit">Save Changes</button>
        </form>
      </div>
    </section>

    <section class="dashboard-section cards-row">
      <div class="card full-width" id="assignmentsProfileCard">
        <h3>Assignments</h3>
        <ul id="profileAssignmentList"></ul>
      </div>
    </section>

    <section class="dashboard-section cards-row">
      <div class="card full-width" id="jobsProfileCard">
        <h3>Job Opportunities</h3>
        <ul id="profileJobList"></ul>
      </div>
    </section>

    <section class="dashboard-section">
      <a class="button" href="http://localhost:3000/student-dashboard.html" id="studentDashboardLink">Student Dashboard</a>
      <a class="button" href="http://localhost:3000/admin-dashboard.html" id="adminDashboardLink">Admin Dashboard</a>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
